// Minimal vendored copy of google/rpc/status.proto from googleapis
// (https://github.com/googleapis/googleapis/blob/master/google/rpc/status.proto).
// OTLP/HTTP requires error responses to carry a serialized google.rpc.Status.
// Field numbers and package must stay identical to upstream for wire compatibility.

syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

message Status {
    // The status code, which should be an enum value of google.rpc.Code.
    int32 code = 1;

    // A developer-facing error message.
    string message = 2;

    // A list of messages that carry the error details.
    repeated google.protobuf.Any details = 3;
}
