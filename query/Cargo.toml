[workspace]
resolver = "3"
members = ["crates/logquery", "crates/planner", "crates/logscan", "crates/query-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
logquery = { path = "crates/logquery" }
planner = { path = "crates/planner" }
logscan = { path = "crates/logscan" }

# DataFusion 55 / Arrow 59 (datafusion-distributed 4.x needs them). No
# released iceberg crate supports them yet (Oct 2026), so these are pinned
# git revisions: the DataFusion integration moved to apache/datafusion-iceberg,
# whose main uses iceberg-rust 5b82ab99. Switch to releases when they ship;
# upgrade all of these together.
datafusion = "55"
datafusion-proto = "55"
arrow-json = "59"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg", rev = "b641e5ebe9e92967499ae7e440ba10d7797712df" }

async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 4
