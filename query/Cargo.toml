[workspace]
resolver = "3"
members = ["crates/logquery", "crates/planner", "crates/query-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
logquery = { path = "crates/logquery" }
planner = { path = "crates/planner" }

# iceberg-datafusion 0.10 pins DataFusion 53 / Arrow 58; upgrade them together
datafusion = "53.1"
arrow-json = "58"
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
iceberg-datafusion = "0.10.1"
iceberg-storage-opendal = "0.10.1"

async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 4
