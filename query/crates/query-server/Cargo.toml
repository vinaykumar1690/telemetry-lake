[package]
name = "query-server"
description = "HTTP log query service over the Iceberg logs table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "otel-query"
path = "src/main.rs"

[dependencies]
logquery.workspace = true
logscan.workspace = true
planner.workspace = true

arrow-json.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
datafusion.workspace = true
futures.workspace = true
iceberg.workspace = true
iceberg-catalog-rest.workspace = true
iceberg-storage-opendal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tonic = { version = "0.14", features = ["transport"] }
url = "2"
datafusion-distributed = "4"

[dev-dependencies]
logscan = { workspace = true, features = ["test-fixtures"] }
planner = { workspace = true, features = ["test-fixtures"] }
tokio-stream = { version = "0.1", features = ["net"] }
url = "2"
tower.workspace = true
