[package]
name = "loadgen"
description = "Sustained OTLP log load against the ingester, driven from the UI's Load test tab"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[[bin]]
name = "otel-loadgen"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bytes = "1"
flate2 = "1"
http-body-util = "0.1"
itoa = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "logs", "with-serde"] }
prost = "0.14"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 4
