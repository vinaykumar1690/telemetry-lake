{{- if .Values.appender.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appender
  namespace: {{ .Values.namespace }}
  labels:
    app: appender
    {{- include "telemetry-lake.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.appender.replicas }}
  selector:
    matchLabels:
      app: appender
  template:
    metadata:
      labels:
        app: appender
        {{- include "telemetry-lake.labels" . | nindent 8 }}
      annotations:
        {{- include "telemetry-lake.scrapeAnnotations" (dict "root" . "port" .Values.appender.healthPort) | nindent 8 }}
    spec:
      # SIGTERM triggers a drain and a final Iceberg commit (with retries);
      # give it time before the kubelet sends SIGKILL
      terminationGracePeriodSeconds: {{ .Values.appender.terminationGracePeriodSeconds }}
      containers:
        - name: appender
          image: "{{ .Values.appender.image.repository }}:{{ .Values.appender.image.tag }}"
          imagePullPolicy: {{ .Values.appender.image.pullPolicy }}
          env:
            # Kafka configuration
            - name: KAFKA_BROKERS
              value: {{ .Values.appender.kafka.brokers | default (include "telemetry-lake.kafkaBootstrap" .) | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.appender.kafka.topic | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.appender.kafka.consumerGroup | quote }}
            # Iceberg catalog configuration
            - name: ICEBERG_CATALOG_URI
              value: {{ .Values.appender.iceberg.catalogUri | default (include "telemetry-lake.nessieEndpoint" .) | quote }}
            - name: ICEBERG_TABLE_NAME
              value: {{ .Values.appender.iceberg.tableName | quote }}
            # S3/MinIO configuration
            - name: S3_ENDPOINT
              value: {{ .Values.appender.s3.endpoint | default (include "telemetry-lake.minioEndpoint" .) | quote }}
            - name: S3_BUCKET
              value: {{ .Values.appender.s3.bucket | quote }}
            - name: S3_ACCESS_KEY
              {{- if .Values.appender.s3.accessKeySecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appender.s3.accessKeySecret.name }}
                  key: {{ .Values.appender.s3.accessKeySecret.key }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
              {{- end }}
            - name: S3_SECRET_KEY
              {{- if .Values.appender.s3.secretKeySecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appender.s3.secretKeySecret.name }}
                  key: {{ .Values.appender.s3.secretKeySecret.key }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
              {{- end }}
            # Iceberg warehouse registered in Nessie
            - name: ICEBERG_WAREHOUSE
              value: {{ .Values.appender.iceberg.warehouse | default .Values.nessie.warehouse | quote }}
            # Commit triggers: total staged bytes across partitions, or age of the oldest staged row
            - name: BUFFER_SIZE_MB
              value: {{ .Values.appender.buffer.sizeMB | quote }}
            - name: BUFFER_TIME_SECONDS
              value: {{ .Values.appender.buffer.timeSeconds | quote }}
            # Staged bytes at which consumption is throttled (backpressure)
            - name: MAX_STAGED_MB
              value: {{ .Values.appender.buffer.maxStagedMB | quote }}
            - name: PIPELINE_THREADS
              value: {{ .Values.appender.pipeline.threads | quote }}
            - name: PIPELINE_QUEUE_MB
              value: {{ .Values.appender.pipeline.queueMB | quote }}
            # Poison messages are produced here with their original bytes
            - name: KAFKA_DLQ_TOPIC
              value: {{ .Values.appender.kafka.dlqTopic | default (printf "%s-dlq" .Values.appender.kafka.topic) | quote }}
            - name: REVOKE_TIMEOUT_SECONDS
              value: {{ .Values.appender.revokeTimeoutSeconds | quote }}
            - name: PROMOTED_ATTRIBUTES
              value: {{ .Values.appender.promotedAttributes | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.appender.healthPort | quote }}
            # Observability
            - name: KAFKA_STATS_INTERVAL_MS
              value: {{ .Values.appender.kafkaStatsIntervalMs | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.observability.logFormat | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
            - name: APPENDER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # DuckDB spills here when staging or a commit outgrows its memory
            - name: DUCKDB_TEMP_DIRECTORY
              value: /var/tmp/duckdb
            # Sized to the pod: DuckDB otherwise takes 80 % of the memory and
            # one thread per core it detects
            - name: DUCKDB_MEMORY_LIMIT_MB
              value: {{ .Values.appender.duckdb.memoryLimitMB | quote }}
            - name: DUCKDB_THREADS
              value: {{ .Values.appender.duckdb.threads | quote }}
            - name: KAFKA_QUEUED_MAX_KBYTES
              value: {{ .Values.appender.kafka.queuedMaxKBytes | quote }}
            # glibc otherwise keeps up to 8 malloc arenas per core, holding freed
            # memory that DuckDB's limit does not see
            - name: MALLOC_ARENA_MAX
              value: "2"
          volumeMounts:
            - name: duckdb-tmp
              mountPath: /var/tmp/duckdb
          ports:
            - name: health
              containerPort: {{ .Values.appender.healthPort }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.appender.resources | nindent 12 }}
      volumes:
        - name: duckdb-tmp
          emptyDir:
            sizeLimit: {{ .Values.appender.duckdbTempSizeLimit }}
{{- end }}
