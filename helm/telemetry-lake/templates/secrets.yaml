{{- if and (not .Values.s3.existingSecret) (or .Values.minio.enabled (and .Values.s3.accessKey .Values.s3.secretKey)) }}
# S3 keys for every service: MinIO's root keys with the in-chart MinIO, or
# s3.accessKey/s3.secretKey passed at install time. With s3.existingSecret
# (recommended for AWS) the chart creates no Secret and keys never pass
# through values or the release history.
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "telemetry-lake.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.minio.enabled }}
  access-key: {{ .Values.minio.accessKey | quote }}
  secret-key: {{ .Values.minio.secretKey | quote }}
  {{- else }}
  access-key: {{ .Values.s3.accessKey | quote }}
  secret-key: {{ .Values.s3.secretKey | quote }}
  {{- end }}
{{- end }}
