{{- if .Values.kafka.enabled }}
{{- $jmx := and .Values.observability.enabled .Values.kafka.metrics.jmx.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
  labels:
    app: kafka
    {{- include "telemetry-lake.labels" . | nindent 4 }}
spec:
  serviceName: kafka-headless
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        {{- include "telemetry-lake.labels" . | nindent 8 }}
      {{- if $jmx }}
      annotations:
        {{- include "telemetry-lake.scrapeAnnotations" (dict "root" . "port" .Values.kafka.metrics.jmx.port) | nindent 8 }}
        checksum/jmx-config: {{ include (print $.Template.BasePath "/kafka-jmx-configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      # EBS volumes are root-owned; the kubelet gives this group write access
      # (kind's local-path volumes are world-writable and hide the need)
      securityContext:
        fsGroup: 1000   # apache/kafka runs as appuser (1000:1000)
      {{- if $jmx }}
      # The Kafka image has no JMX exporter; fetch the agent into a shared volume
      initContainers:
        - name: fetch-jmx-agent
          image: curlimages/curl:8.16.0
          command:
            - curl
            - -fsSL
            - -o
            - /jmx/jmx_prometheus_javaagent.jar
            - https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/{{ .Values.kafka.metrics.jmx.agentVersion }}/jmx_prometheus_javaagent-{{ .Values.kafka.metrics.jmx.agentVersion }}.jar
          volumeMounts:
            - name: jmx-agent
              mountPath: /jmx
      {{- end }}
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - name: client
              containerPort: 9092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
            {{- if $jmx }}
            - name: metrics
              containerPort: {{ .Values.kafka.metrics.jmx.port }}
              protocol: TCP
            {{- end }}
          command:
            - /bin/bash
            - -c
            - |
              # Generate server.properties from environment
              cat > /opt/kafka/config/kraft/server.properties << EOF
              process.roles=broker,controller
              node.id=1
              controller.quorum.voters=1@kafka-0.kafka-headless.{{ .Values.namespace }}.svc.cluster.local:9093
              listeners=PLAINTEXT://:9092,CONTROLLER://:9093
              advertised.listeners=PLAINTEXT://kafka.{{ .Values.namespace }}.svc.cluster.local:9092
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=PLAINTEXT
              # A subdirectory: an ext4 volume's lost+found at the root makes Kafka
              # refuse to start ("not in the form of topic-partition")
              log.dirs=/var/lib/kafka/data/logs
              auto.create.topics.enable={{ .Values.kafka.config.autoCreateTopics }}
              num.partitions={{ .Values.kafka.config.numPartitions }}
              default.replication.factor={{ .Values.kafka.config.defaultReplicationFactor }}
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              log.retention.hours={{ .Values.kafka.config.logRetentionHours }}
              message.max.bytes={{ int .Values.kafka.config.messageMaxBytes }}
              replica.fetch.max.bytes={{ int .Values.kafka.config.messageMaxBytes }}
              EOF

              # Format storage if not already done
              if [ ! -f /var/lib/kafka/data/logs/meta.properties ]; then
                /opt/kafka/bin/kafka-storage.sh format -t MkU3OEVBNTcwNTJENDM2Qk -c /opt/kafka/config/kraft/server.properties --ignore-formatted
              fi

              # Start Kafka
              exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx{{ int .Values.kafka.heapMB }}M -Xms{{ int .Values.kafka.heapMB }}M"
            {{- if $jmx }}
            - name: KAFKA_OPTS
              value: "-javaagent:/jmx/jmx_prometheus_javaagent.jar={{ .Values.kafka.metrics.jmx.port }}:/etc/jmx/config.yaml"
            {{- end }}
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            {{- if $jmx }}
            - name: jmx-agent
              mountPath: /jmx
            - name: jmx-config
              mountPath: /etc/jmx
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 5
      {{- if $jmx }}
      volumes:
        - name: jmx-agent
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: kafka-jmx-config
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "telemetry-lake.storageClass" (dict "root" . "indent" 8) }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
{{- end }}
