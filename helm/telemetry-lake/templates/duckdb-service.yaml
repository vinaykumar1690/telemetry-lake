{{- if .Values.duckdbShell.enabled }}
# DuckDB command-line shell for ad hoc SQL against the bucket. Not the
# appender: its DuckDB is a library in the appender image (appender.duckdb.*)
apiVersion: v1
kind: Service
metadata:
  name: duckdb
  namespace: {{ .Values.namespace }}
  labels:
    app: duckdb
    {{- include "telemetry-lake.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - name: duckdb
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: duckdb
{{- end }}
