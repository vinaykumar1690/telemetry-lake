{{- if and .Values.kafka.enabled .Values.observability.enabled .Values.kafka.metrics.jmx.enabled }}
# Prometheus JMX exporter rules: broker throughput, request latency, handler
# saturation and replication health. JVM metrics (jvm_*) are exported as well.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-jmx-config
  namespace: {{ .Values.namespace }}
  labels:
    app: kafka
    {{- include "telemetry-lake.labels" . | nindent 4 }}
data:
  config.yaml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      # Bytes and messages in/out, per topic and in total
      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec|BytesRejectedPerSec|FailedProduceRequestsPerSec|FailedFetchRequestsPerSec|TotalProduceRequestsPerSec|TotalFetchRequestsPerSec), topic=(.+)><>Count'
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
        labels:
          topic: "$2"
      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec|BytesRejectedPerSec|FailedProduceRequestsPerSec|FailedFetchRequestsPerSec|TotalProduceRequestsPerSec|TotalFetchRequestsPerSec)><>Count'
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
      # Replication health
      - pattern: 'kafka.server<type=ReplicaManager, name=(UnderReplicatedPartitions|UnderMinIsrPartitionCount|OfflineReplicaCount|PartitionCount|LeaderCount)><>Value'
        name: kafka_server_replicamanager_$1
        type: GAUGE
      - pattern: 'kafka.controller<type=KafkaController, name=(ActiveControllerCount|OfflinePartitionsCount|GlobalPartitionCount)><>Value'
        name: kafka_controller_$1
        type: GAUGE
      # Saturation: fraction of time request handler and network threads are idle
      - pattern: 'kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>OneMinuteRate'
        name: kafka_server_request_handler_avg_idle_ratio
        type: GAUGE
      - pattern: 'kafka.network<type=SocketServer, name=NetworkProcessorAvgIdlePercent><>Value'
        name: kafka_network_processor_avg_idle_ratio
        type: GAUGE
      # Request rates and latency percentiles by request type
      - pattern: 'kafka.network<type=RequestMetrics, name=RequestsPerSec, request=(\w+)(, version=\d+)?><>Count'
        name: kafka_network_requests_total
        type: COUNTER
        labels:
          request: "$1"
      - pattern: 'kafka.network<type=RequestMetrics, name=TotalTimeMs, request=(Produce|FetchConsumer|FetchFollower|OffsetCommit|OffsetFetch|JoinGroup|SyncGroup|Heartbeat|Metadata)><>(50thPercentile|99thPercentile)'
        name: kafka_network_request_total_time_ms
        type: GAUGE
        labels:
          request: "$1"
          quantile: "$2"
      # Log flushes
      - pattern: 'kafka.log<type=LogFlushStats, name=LogFlushRateAndTimeMs><>(Count|99thPercentile)'
        name: kafka_log_flush_$1
        type: GAUGE
      # Group coordinator
      - pattern: 'kafka.coordinator.group<type=GroupMetadataManager, name=(NumGroups|NumOffsets)><>Value'
        name: kafka_coordinator_group_$1
        type: GAUGE
{{- end }}
