{{- if .Values.ingester.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingester
  namespace: {{ .Values.namespace }}
  labels:
    app: ingester
    {{- include "telemetry-lake.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingester.replicas }}
  selector:
    matchLabels:
      app: ingester
  template:
    metadata:
      labels:
        app: ingester
        {{- include "telemetry-lake.labels" . | nindent 8 }}
      annotations:
        {{- include "telemetry-lake.scrapeAnnotations" (dict "root" . "port" .Values.ingester.metricsPort) | nindent 8 }}
    spec:
      containers:
        - name: ingester
          image: {{ include "telemetry-lake.image" (dict "root" . "image" .Values.ingester.image) | quote }}
          imagePullPolicy: {{ .Values.ingester.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.ingester.metricsPort }}
              protocol: TCP
          env:
            # Kafka configuration
            - name: KAFKA_BROKERS
              value: {{ .Values.ingester.kafka.brokers | default (include "telemetry-lake.kafkaBootstrap" .) | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.ingester.kafka.topic | quote }}
            # Producer tuning
            - name: MAX_IN_FLIGHT
              value: {{ .Values.ingester.kafka.maxInFlight | quote }}
            - name: PRODUCER_ACKS
              value: {{ .Values.ingester.kafka.acks | quote }}
            - name: PRODUCER_COMPRESSION
              value: {{ .Values.ingester.kafka.compression | quote }}
            # HTTP server
            - name: HTTP_THREADS
              value: {{ .Values.ingester.httpThreads | quote }}
            - name: MAX_BODY_BYTES
              value: {{ int .Values.ingester.limits.maxBodyBytes | quote }}
            - name: MAX_DECOMPRESSED_BYTES
              value: {{ int .Values.ingester.limits.maxDecompressedBytes | quote }}
            # Observability
            - name: METRICS_PORT
              value: {{ .Values.ingester.metricsPort | quote }}
            - name: KAFKA_STATS_INTERVAL_MS
              value: {{ .Values.ingester.kafkaStatsIntervalMs | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.observability.logFormat | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.observability.logLevel | quote }}
          resources:
            {{- toYaml .Values.ingester.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ingester.probes.liveness.path }}
              port: {{ .Values.ingester.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.ingester.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ingester.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.ingester.probes.readiness.path }}
              port: {{ .Values.ingester.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.ingester.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ingester.probes.readiness.periodSeconds }}
{{- end }}
