{{- if .Values.duckdbShell.enabled }}
# DuckDB command-line shell for ad hoc SQL against the bucket. Not the
# appender: its DuckDB is a library in the appender image (appender.duckdb.*)
apiVersion: v1
kind: ConfigMap
metadata:
  name: duckdb-init
  namespace: {{ .Values.namespace }}
  labels:
    app: duckdb
    {{- include "telemetry-lake.labels" . | nindent 4 }}
data:
  init.sql: |
    -- Install and load required extensions
    INSTALL iceberg;
    INSTALL httpfs;
    LOAD iceberg;
    LOAD httpfs;

    -- S3 secret; the keys come from the pod's environment (s3-credentials or
    -- s3.existingSecret), never from this ConfigMap
    {{- $endpoint := include "telemetry-lake.s3Endpoint" . }}
    CREATE SECRET s3_secret (
        TYPE S3,
        KEY_ID getenv('S3_ACCESS_KEY'),
        SECRET getenv('S3_SECRET_KEY'),
        REGION '{{ .Values.s3.region }}',
        ENDPOINT '{{ $endpoint | trimPrefix "https://" | trimPrefix "http://" }}',
        USE_SSL {{ hasPrefix "https://" $endpoint }},
        URL_STYLE '{{ include "telemetry-lake.s3UrlStyle" . }}'
    );

    -- Show confirmation
    SELECT 'DuckDB initialized with Iceberg and HTTPFS extensions' AS status;
    SELECT 'S3 secret configured' AS status;

  init.sh: |
    #!/bin/sh
    set -e

    echo "Initializing DuckDB extensions..."

    # Run the init SQL to install extensions
    duckdb -c "INSTALL iceberg; INSTALL httpfs;"

    echo "Extensions installed successfully"
    echo "DuckDB is ready. Use 'duckdb' to start the shell."

    # Keep the container running
    tail -f /dev/null
{{- end }}
