# Namespace for all resources
namespace: telemetry-lake

# Deployment profiles: values-local.yaml (kind / Docker Desktop: MinIO, small
# memory budgets) and values-eks.yaml (AWS: S3, gp3 volumes, persistent Nessie,
# larger budgets). These defaults are the local ones.

# StorageClass for every volume; empty uses the cluster's default
storageClass: ""

# Object storage for the lake, shared by Nessie, the appender, query, query
# workers, compaction and nessie-gc
s3:
  bucket: telemetrylake
  endpoint: ""          # empty: the in-chart MinIO; required without it (https://s3.<region>.amazonaws.com)
  region: us-east-1
  urlStyle: ""          # path or vhost; empty: path for MinIO, vhost otherwise
  # Secret with keys access-key and secret-key (recommended on AWS: keys never
  # pass through values). Without it the chart creates s3-credentials from
  # MinIO's root keys, or from accessKey/secretKey given at install time.
  existingSecret: ""
  accessKey: ""
  secretKey: ""

# Kafka Configuration
kafka:
  enabled: true
  image: apache/kafka:3.7.0
  replicas: 1
  storage: 2Gi
  # Kafka broker configuration
  config:
    # Auto-create topics when producers/consumers connect
    autoCreateTopics: true
    # Default number of partitions for auto-created topics
    numPartitions: 3
    # Default replication factor
    defaultReplicationFactor: 1
    # Log retention hours
    logRetentionHours: 1
    # Largest record batch the broker accepts (16 MiB + 1 MiB headroom). Must be
    # >= the ingester's message.max.bytes (max(limits) + 64 KiB), otherwise large
    # payloads are acknowledged over HTTP and then fail delivery.
    messageMaxBytes: 17825792
  # Broker JMX metrics through the Prometheus JMX exporter java agent (fetched
  # from Maven Central by an init container); scraped when observability is on
  metrics:
    jmx:
      enabled: true
      agentVersion: "1.0.1"
      port: 7071
  # Topic for telemetry log events
  topics:
    logs: telemetry-logs
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# MinIO: local S3, for laptops. Off on AWS (values-eks.yaml)
minio:
  enabled: true
  # Built from source (docker/minio/Dockerfile): MinIO no longer publishes
  # community images or binaries
  image: telemetry-lake/minio:latest
  imagePullPolicy: IfNotPresent
  # MinIO's root keys, which the services then use
  accessKey: minioadmin
  secretKey: minioadmin
  storage: 1Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  console:
    enabled: true
    # Set nodePort to expose console externally (e.g., 30901)
    nodePort: null

# Nessie Configuration
nessie:
  image: ghcr.io/projectnessie/nessie:latest
  warehouse: telemetrylake
  # inMemory forgets every table when the pod restarts (fine on a laptop);
  # rocksdb keeps the catalog on a volume (one replica)
  versionStore: inMemory
  storage: 10Gi   # rocksdb only
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# DuckDB command-line shell for ad hoc SQL against the bucket
# (kubectl exec -it duckdb-0 -- duckdb). Not the appender's DuckDB, which is a
# library in the appender image, configured under appender.duckdb
duckdbShell:
  enabled: true
  image: debian:bookworm-slim
  imagePullPolicy: IfNotPresent
  storage: 1Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Ingester Configuration (HTTP receiver -> Kafka producer)
ingester:
  enabled: true
  # Container image (will be built from this codebase)
  image:
    repository: telemetry-lake/ingester
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  # Service configuration
  service:
    type: ClusterIP
    port: 4318
  # Kafka producer settings
  kafka:
    # Broker address - uses Kafka service from this chart
    # Override for external Kafka: "kafka.external.svc:9092"
    brokers: ""  # Defaults to kafka.<namespace>.svc.cluster.local:9092
    topic: "telemetry-logs"
    # Producer tuning
    maxInFlight: 1000
    acks: -1  # -1=all, 1=leader, 0=none
    compression: "snappy"
  # Request size limits; each accepted payload becomes one Kafka message
  limits:
    maxBodyBytes: 16777216          # 16 MiB as received
    maxDecompressedBytes: 16777216  # 16 MiB after gzip decompression
  # HTTP worker threads. Set to the CPU limit: the default (one per node CPU)
  # oversubscribes the container and multiplies peak per-request memory.
  httpThreads: 2
  # Prometheus /metrics, on its own port (the OTLP port is proxied by the UI)
  metricsPort: 9464
  # librdkafka statistics (rdkafka_* metrics); 0 disables them
  kafkaStatsIntervalMs: 15000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # Liveness and readiness probes
  probes:
    liveness:
      path: /health
      port: 4318
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /ready
      port: 4318
      initialDelaySeconds: 5
      periodSeconds: 5

# Appender Configuration (Kafka consumer -> Iceberg writer)
appender:
  enabled: true
  # Container image (will be built from this codebase)
  image:
    repository: telemetry-lake/appender
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  # Kafka consumer settings
  kafka:
    # Broker address - uses Kafka service from this chart
    brokers: ""  # Defaults to kafka.<namespace>.svc.cluster.local:9092
    topic: "telemetry-logs"
    consumerGroup: "otel-appender"
    dlqTopic: ""  # Defaults to <topic>-dlq (auto-created when autoCreateTopics is on)
    # librdkafka prefetch per partition (its default, 64 MiB, overruns a 1 GiB pod)
    queuedMaxKBytes: 16384
  # Iceberg catalog settings
  iceberg:
    # Catalog URI - uses Nessie's Iceberg REST endpoint from this chart
    catalogUri: ""  # Defaults to http://nessie:19120/iceberg/
    warehouse: ""   # Defaults to nessie.warehouse
    tableName: "logs"
  # Commit triggers (whichever comes first) and the staging cap
  buffer:
    sizeMB: 100
    timeSeconds: 60
    maxStagedMB: 256   # must be >= sizeMB; keep well under the memory limit
  pipeline:
    threads: 2
    queueMB: 32        # per thread
  revokeTimeoutSeconds: 60
  # Attribute keys stored as their own VARCHAR columns (k8s.pod.name -> k8s_pod_name),
  # comma-separated; they get file statistics and bloom filters, map entries do not
  promotedAttributes: ""
  terminationGracePeriodSeconds: 120
  healthPort: 8080   # also serves /metrics
  # emptyDir DuckDB spills to when staged rows or a commit outgrow its memory
  duckdbTempSizeLimit: 4Gi
  # DuckDB's memory limit and threads. Keep memoryLimitMB above
  # buffer.maxStagedMB and, with the Kafka prefetch (partitions ×
  # kafka.queuedMaxKBytes) and the pipeline queues, under resources.limits.memory
  duckdb:
    memoryLimitMB: 512
    threads: 2
  # librdkafka statistics: rdkafka_* metrics and the commit lag; 0 disables them
  kafkaStatsIntervalMs: 15000
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1536Mi"  # DuckDB (duckdb.memoryLimitMB) plus ~500 MiB outside it while catching up
      cpu: "1000m"

# Log query service (otel-query): JSON search and read-only SQL over the logs table
query:
  enabled: true
  image:
    repository: telemetry-lake/query
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2            # ignored while autoscaling is enabled
  service:
    type: ClusterIP
    port: 8090
  defaultLimit: 100
  maxLimit: 1000
  maxRangeHours: 168     # longest time range a search may cover
  timeoutSeconds: 30
  maxConcurrent: 16      # concurrent queries per replica; more wait up to 2s, then 429
  memoryLimitMB: 1536    # DataFusion memory pool; keep under resources.limits.memory
  tableRefreshMs: 5000   # how stale the table metadata may be (new commits appear within this)
  # Distributed execution: scans planned to read at least distributeMinGB are
  # split across the workers, one task per bytesPerTaskMB
  distributeMinGB: 2
  bytesPerTaskMB: 1024
  workers:
    enabled: true
    replicas: 2          # ignored while autoscaling is enabled
    memoryLimitMB: 1536
    autoscaling:
      enabled: true
      minReplicas: 2     # warm: a large query never waits for a worker to start
      maxReplicas: 20
      targetCPUUtilization: 70
    resources:
      requests:
        memory: "1Gi"
        cpu: "1000m"
      limits:
        memory: "2Gi"
        cpu: "4000m"
  autoscaling:
    enabled: true
    minReplicas: 2       # warm replicas: small queries never wait for a cold start
    maxReplicas: 10
    targetCPUUtilization: 70
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

# Web UI: log search over the query service and a synthetic log generator
# that posts to the ingester. Reach it with
#   kubectl port-forward -n <namespace> svc/ui 8080:80
ui:
  enabled: true
  image:
    repository: telemetry-lake/ui
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  # Override to point at services outside this release
  # (fully qualified host names; nginx does not apply DNS search domains)
  queryUpstream: ""   # Defaults to http://query.<namespace>.svc.cluster.local:<query.service.port>
  ingestUpstream: ""  # Defaults to http://ingester.<namespace>.svc.cluster.local:<ingester.service.port>
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "500m"

# Load generator (otel-loadgen): sustained OTLP load against the ingester,
# configured and watched from the UI's Load test tab (docs/load-testing.md)
loadgen:
  enabled: true
  image:
    repository: telemetry-lake/loadgen
    tag: latest
    pullPolicy: IfNotPresent
  port: 8095
  ingestUrl: ""            # Defaults to http://ingester.<namespace>.svc.cluster.local:<ingester.service.port>
  # Caps on what the UI may ask for
  maxRecordsPerSecond: 2000000
  maxInFlight: 4096
  maxRequestBytes: ""      # Defaults to ingester.limits.maxDecompressedBytes
  requestTimeoutSeconds: 30
  # The controller sends the load itself while workers.replicas is 0
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "2000m"
  # Each worker sends an even share of the rate; add workers when the
  # Load test tab shows "behind" with requests to spare in flight
  workers:
    replicas: 0
    resources:
      requests:
        memory: "256Mi"
        cpu: "1000m"
      limits:
        memory: "1Gi"
        cpu: "2000m"

# Iceberg table maintenance (compaction/compact.py, Spark)
compaction:
  enabled: true
  image:
    repository: telemetry-lake/compaction
    tag: latest
    pullPolicy: IfNotPresent
  schedule: "17 * * * *"     # hourly
  steps: "properties,compact,offsets,expire,orphans,manifests"   # expire/orphans skip Nessie tables
  minAgeMinutes: 60          # leave the newest files as the appender wrote them
  targetFileSizeMB: 512
  snapshotRetentionHours: 24 # catalogs with Iceberg GC enabled only
  activeDeadlineSeconds: 3000
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "3Gi"
      cpu: "4000m"

# Nessie GC: deletes files no longer referenced (e.g. replaced by compaction)
nessieGc:
  enabled: true
  image: ghcr.io/projectnessie/nessie-gc:latest
  schedule: "43 3 * * *"     # daily
  cutoff: "PT24H"            # history kept for Nessie time travel
  maxFileAgeMinutes: 60      # never delete files younger than this (in-flight commits)
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Observability of the stack itself: Prometheus (metrics and alert rules),
# Loki (logs), Grafana (dashboards), kafka-exporter (broker-side consumer group
# lag) and an OpenTelemetry Collector DaemonSet that ships every pod's stdout
# in this namespace to Loki. Reach Grafana with
#   kubectl port-forward -n <namespace> svc/grafana 3000:3000
observability:
  enabled: true
  # LOG_FORMAT of the ingester and appender: json for the collector, text for kubectl logs
  logFormat: json
  logLevel: info

  prometheus:
    image: prom/prometheus:v3.7.2
    retention: 7d
    storage: 5Gi
    scrapeInterval: 15s
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    # Alert thresholds (rules in templates/prometheus.yaml)
    alerts:
      commitLagMessages: 100000    # appender commit lag sustained for 10 minutes
      groupLagMessages: 100000     # kafka-exporter group lag (works when the appender is down)
      ingesterErrorRatio: 0.05     # 5xx and 503 share of /v1/logs requests

  loki:
    image: grafana/loki:3.5.7
    retention: 168h
    storage: 10Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  grafana:
    image: grafana/grafana:12.2.1
    adminUser: admin
    adminPassword: admin   # change for anything but a local cluster
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  kafkaExporter:
    image: danielqsj/kafka-exporter:v1.9.0
    resources:
      requests:
        memory: "32Mi"
        cpu: "20m"
      limits:
        memory: "128Mi"
        cpu: "200m"

  collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "500m"

